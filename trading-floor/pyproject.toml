[project]
name = "trading-floor"
version = "0.1.0"
description = "Phase 0 foundation for a personal spot-only trading floor."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "python-telegram-bot>=21",
    "pyyaml>=6",
    "redis>=5",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    ".",
    "libs/tf_models",
    "libs/tf_journal",
    "libs/tf_bus",
    "libs/tf_config",
    "services/data",
    "services/execution",
    "services/risk",
    "services/compliance",
    "services/comms",
    "services/console_api",
    "services/scheduler",
]
